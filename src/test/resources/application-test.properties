# Propriedades de teste para o módulo parcel-service
jwt.secret=Zm9vYmFyYmF6cXV4c3VzZWFzdGhlbWU=
jwt.expirationMs=3600000

spring.datasource.url=jdbc:h2:mem:parceldb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Não rodar Flyway nos testes (usando Hibernate para criar o schema)
spring.flyway.enabled=false

# Instrução para o Hibernate criar e dropar o schema automaticamente durante os testes
spring.jpa.hibernate.ddl-auto=create-drop

# Opções úteis para debug dos testes
spring.jpa.show-sql=true
logging.level.org.hibernate.SQL=DEBUG